spring:
  application:
    name: fceQuestionBank
  datasource:
    url: jdbc:postgresql://localhost:5432/questionBank?characterEncoding=UTF-8
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    sql-migration-prefix: ""
    sql-migration-separator: "_"
    sql-migration-suffixes: ".sql"
    validate-migration-naming: true
    fail-on-missing-locations: true

logging:
  level:
    org.flywaydb: INFO
