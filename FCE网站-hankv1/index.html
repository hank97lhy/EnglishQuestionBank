<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="FCE标准版与校园版阅读、语用真题讲评题库">
  <title>FCE 阅读与语用题库</title>
  <style>
    :root{--ink:#46503b;--muted:#777b6d;--line:#dcded1;--paper:#fff;--wash:#F7F4EA;--green:#E8EDD3;--green-2:#F3F5E8;--green-soft:#E8EDD3;--blue:#E8EDD3;--blue-2:#F3F5E8;--blue-soft:#E8EDD3;--shadow:0 8px 24px rgba(76,83,59,.07);font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--wash)}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:#F7F4EA;font-size:16px}button,a{font:inherit}button{color:inherit}
    .topbar{position:sticky;top:0;z-index:10;background:rgba(247,244,234,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .topbar-inner{max-width:1500px;margin:auto;padding:20px 28px 0}.brand-row{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:13px}.brand-mark{width:40px;height:40px;border-radius:12px;background:#E8EDD3;color:#46503b;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 5px 14px rgba(92,102,70,.12)}h1{font-size:24px;margin:0;letter-spacing:.02em}.count{color:var(--muted);font-size:14px}
    .tabs{display:flex;gap:8px;margin-top:18px}.tab{position:relative;border:0;background:transparent;padding:13px 22px 15px;color:#777b6d;font-size:18px;font-weight:700;cursor:pointer}.tab[aria-selected="true"]{color:#596449}.tab[aria-selected="true"]::after{content:"";position:absolute;left:20px;right:20px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:#aab68b}.tab:focus-visible,.test.ready:focus-visible{outline:3px solid #b6c294;outline-offset:2px}
    main{max-width:1500px;margin:auto;padding:28px}.series-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.series-title{margin:0;font-size:22px}.series-note{margin:6px 0 0;color:var(--muted);font-size:14px}.legend{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#9eab7c}.dot.pending{background:#c9cbbf}
    .books{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.book{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--shadow)}.book-head{padding:18px 14px;text-align:center;color:#46503b;background:#E8EDD3}.standard .book-head{background:#E8EDD3}.book-name{font-size:18px;font-weight:800}.tests{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line)}.test{display:block;min-width:0;text-decoration:none;background:#fff;color:#46503b}.test-head{display:flex;justify-content:space-between;align-items:center;min-height:58px;padding:12px 13px;background:#F7F4EA;font-weight:800}.standard .test-head{background:#F7F4EA}.status{font-size:11px;font-weight:700;padding:3px 6px;border-radius:999px;background:#E8EDD3}.test.disabled .test-head{background:#fbfaf4}.test.disabled{color:#8b8d82}.test.ready{cursor:pointer;transition:.16s ease}.test.ready .test-head{background:#fbfaf4;color:#596449}.test.ready:hover .test-head{background:#fbfaf4;color:#46503b}.test.ready:hover .status{background:#dfe6c4}.panel[hidden]{display:none}.empty-hint{display:none}
    @media(max-width:1200px){.books{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:650px){.topbar-inner{padding:15px 16px 0}.brand-row{align-items:flex-start}.brand-mark{width:36px;height:36px}.brand h1{font-size:19px}.count{display:none}.tabs{margin-top:10px}.tab{font-size:16px;padding:11px 15px 13px}.tab[aria-selected="true"]::after{left:14px;right:14px}main{padding:20px 14px}.series-head{align-items:flex-start}.legend{display:none}.series-title{font-size:20px}.books{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.book-head{padding:14px 10px}.test-head{min-height:54px;padding:10px}}
    @media(max-width:390px){.books{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand"><div class="brand-mark">FCE</div><h1>阅读与语用题库</h1></div>
        <div class="count">标准版 24 套 · 校园版 24 套</div>
      </div>
      <nav class="tabs" aria-label="版本选择" role="tablist">
        <button class="tab" id="tab-standard" role="tab" aria-selected="false" aria-controls="standard-panel">标准版</button>
        <button class="tab" id="tab-campus" role="tab" aria-selected="true" aria-controls="campus-panel">校园版</button>
      </nav>
    </div>
  </header>
  <main>
    <section class="panel standard" id="standard-panel" role="tabpanel" aria-labelledby="tab-standard" hidden></section>
    <section class="panel campus" id="campus-panel" role="tabpanel" aria-labelledby="tab-campus"></section>
  </main>
  <script>
    const editions={
      standard:{label:'标准版',note:'6 本 · 每本 4 套题',ready:[{book:1,test:1,href:'standard-1-test-1/index.html'}]},
      campus:{label:'校园版',note:'6 本 · 每本 4 套题',ready:[{book:3,test:1,href:'campus-3-test-1/index.html'}]}
    };
    function renderEdition(key){
      const data=editions[key],panel=document.getElementById(key+'-panel');
      const books=Array.from({length:6},(_,b)=>{
        const book=b+1;
        const tests=Array.from({length:4},(_,t)=>{
          const test=t+1,entry=data.ready?.find(item=>item.book===book&&item.test===test),enabled=!!entry;
          const href=enabled?entry.href:'#';
          const tag=enabled?'a':'div';
          const attrs=enabled?` href="${href}" aria-label="进入${data.label}${book} Test ${test}"`:' aria-disabled="true"';
          return `<${tag} class="test ${enabled?'ready':'disabled'}"${attrs}><div class="test-head"><span>Test ${test}</span><span class="status">${enabled?'可使用':'待录入'}</span></div></${tag}>`;
        }).join('');
        return `<section class="book"><header class="book-head"><span class="book-name">${data.label} ${book}</span></header><div class="tests">${tests}</div></section>`;
      }).join('');
      panel.innerHTML=`<div class="series-head"><div><h2 class="series-title">${data.label}</h2><p class="series-note">${data.note}</p></div><div class="legend"><span><i class="dot"></i>可使用</span><span><i class="dot pending"></i>待录入</span></div></div><div class="books">${books}</div>`;
    }
    renderEdition('standard');renderEdition('campus');
    const tabs=[...document.querySelectorAll('.tab')];
    function selectEdition(key){
      tabs.forEach(tab=>{const selected=tab.id==='tab-'+key;tab.setAttribute('aria-selected',selected);document.getElementById(tab.getAttribute('aria-controls')).hidden=!selected});
      try{localStorage.setItem('fce-library-edition',key)}catch(e){}
    }
    tabs.forEach(tab=>tab.addEventListener('click',()=>selectEdition(tab.id.replace('tab-',''))));
    try{const saved=localStorage.getItem('fce-library-edition');if(saved&&editions[saved])selectEdition(saved)}catch(e){}
  </script>
</body>
</html>
